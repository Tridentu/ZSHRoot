  <text x="22" y="208" xml:space="preserve"><tspan fill="#f8f8f2">     </tspan><tspan fill="#8be9fd">grep</tspan><tspan fill="#f8f8f2"> </tspan><tspan font-weight="bold" fill="#ff79c6">-r</tspan><tspan fill="#f8f8f2"> </tspan><tspan fill="#f1fa8c">'TODO'</tspan><tspan fill="#f8f8f2"> </tspan><tspan text-decoration="underline" fill="#50fa7b">~/src</tspan><tspan fill="#f8f8f2"> </tspan><tspan text-decoration="underline" fill="#50fa7b">/var/log</tspan></text>
