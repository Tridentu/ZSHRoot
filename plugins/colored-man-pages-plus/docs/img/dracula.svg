  <text x="22" y="142" xml:space="preserve"><tspan fill="#f8f8f2">     </tspan><tspan font-weight="bold" fill="#ff79c6">-i</tspan><tspan fill="#f8f8f2">, </tspan><tspan font-weight="bold" fill="#ff79c6">--ignore-case</tspan><tspan fill="#f8f8f2">        ignore case distinctions</tspan></text>
