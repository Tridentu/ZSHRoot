  <text x="22" y="164" xml:space="preserve"><tspan fill="#c0caf5">     </tspan><tspan font-weight="bold" fill="#bb9af7">-r</tspan><tspan fill="#c0caf5">, </tspan><tspan font-weight="bold" fill="#bb9af7">--recursive</tspan><tspan fill="#c0caf5">         search directories recursively</tspan></text>
  <text x="22" y="208" xml:space="preserve"><tspan fill="#c0caf5">     </tspan><tspan fill="#7dcfff">grep</tspan><tspan fill="#c0caf5"> </tspan><tspan font-weight="bold" fill="#bb9af7">-r</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#e0af68">'TODO'</tspan><tspan fill="#c0caf5"> </tspan><tspan text-decoration="underline" fill="#9ece6a">~/src</tspan><tspan fill="#c0caf5"> </tspan><tspan text-decoration="underline" fill="#9ece6a">/var/log</tspan></text>
