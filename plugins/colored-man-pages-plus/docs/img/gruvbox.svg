  <text x="22" y="164" xml:space="preserve"><tspan fill="#ebdbb2">     </tspan><tspan font-weight="bold" fill="#d3869b">-r</tspan><tspan fill="#ebdbb2">, </tspan><tspan font-weight="bold" fill="#d3869b">--recursive</tspan><tspan fill="#ebdbb2">         search directories recursively</tspan></text>
